<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="940" height="460" rx="14" fill="#0b1020"/>
  <text x="28" y="40" fill="#e2e8f0" font-size="20" font-weight="700">Architettura: dal browser ai file del progetto</text>
  <text x="28" y="64" fill="#94a3b8" font-size="13">Tutto il riconoscimento avviene a sinistra (nel browser). Il server manda solo file statici.</text>

  <!-- BROWSER -->
  <rect x="28" y="96" width="300" height="290" rx="14" fill="#111a33" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="48" y="126" fill="#38bdf8" font-size="15" font-weight="700">Browser dell'utente</text>

  <rect x="48" y="142" width="120" height="58" rx="10" fill="#0b1020" stroke="#475569"/>
  <text x="108" y="166" fill="#e2e8f0" font-size="13" text-anchor="middle">Webcam</text>
  <text x="108" y="184" fill="#94a3b8" font-size="11" text-anchor="middle">getUserMedia</text>

  <rect x="188" y="142" width="120" height="58" rx="10" fill="#0b1020" stroke="#475569"/>
  <text x="248" y="166" fill="#e2e8f0" font-size="13" text-anchor="middle">MediaPipe</text>
  <text x="248" y="184" fill="#94a3b8" font-size="11" text-anchor="middle">WebAssembly</text>

  <rect x="48" y="216" width="120" height="58" rx="10" fill="#0b1020" stroke="#475569"/>
  <text x="108" y="240" fill="#e2e8f0" font-size="13" text-anchor="middle">One Euro</text>
  <text x="108" y="258" fill="#94a3b8" font-size="11" text-anchor="middle">filtro</text>

  <rect x="188" y="216" width="120" height="58" rx="10" fill="#0b1020" stroke="#475569"/>
  <text x="248" y="240" fill="#e2e8f0" font-size="13" text-anchor="middle">Three.js</text>
  <text x="248" y="258" fill="#94a3b8" font-size="11" text-anchor="middle">WebGL</text>

  <rect x="48" y="290" width="260" height="70" rx="10" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="178" y="315" fill="#c7d2fe" font-size="12.5" text-anchor="middle">I fotogrammi non escono mai da qui:</text>
  <text x="178" y="335" fill="#c7d2fe" font-size="12.5" text-anchor="middle">nessun upload, nessun salvataggio.</text>
  <text x="178" y="352" fill="#94a3b8" font-size="11" text-anchor="middle">garantito dalla CSP: connect-src 'self'</text>

  <!-- freccia browser -> caddy -->
  <path d="M336 200 L430 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#a)"/>
  <text x="383" y="190" fill="#38bdf8" font-size="11.5" text-anchor="middle">HTTPS 443</text>
  <text x="383" y="218" fill="#64748b" font-size="11" text-anchor="middle">solo HTML, JS,</text>
  <text x="383" y="232" fill="#64748b" font-size="11" text-anchor="middle">wasm, modello</text>

  <!-- VPS -->
  <rect x="440" y="96" width="474" height="290" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="460" y="126" fill="#94a3b8" font-size="15" font-weight="700">VPS</text>

  <rect x="460" y="146" width="180" height="82" rx="10" fill="#111a33" stroke="#f472b6"/>
  <text x="550" y="172" fill="#f472b6" font-size="14" text-anchor="middle" font-weight="700">Caddy</text>
  <text x="550" y="192" fill="#e2e8f0" font-size="11.5" text-anchor="middle">certificato HTTPS</text>
  <text x="550" y="208" fill="#e2e8f0" font-size="11.5" text-anchor="middle">CSP + Permissions-Policy</text>
  <text x="550" y="222" fill="#94a3b8" font-size="11" text-anchor="middle">gira come utente «caddy»</text>

  <path d="M648 187 L706 187" stroke="#f472b6" stroke-width="2" marker-end="url(#b)"/>
  <text x="677" y="177" fill="#f472b6" font-size="11" text-anchor="middle">reverse</text>
  <text x="677" y="202" fill="#f472b6" font-size="11" text-anchor="middle">proxy</text>

  <rect x="714" y="146" width="180" height="82" rx="10" fill="#111a33" stroke="#38bdf8"/>
  <text x="804" y="172" fill="#38bdf8" font-size="14" text-anchor="middle" font-weight="700">deploy/server.mjs</text>
  <text x="804" y="192" fill="#e2e8f0" font-size="11.5" text-anchor="middle">127.0.0.1:8791</text>
  <text x="804" y="208" fill="#e2e8f0" font-size="11.5" text-anchor="middle">servizio systemd «mano»</text>
  <text x="804" y="222" fill="#94a3b8" font-size="11" text-anchor="middle">gira come root</text>

  <path d="M804 236 L804 280" stroke="#38bdf8" stroke-width="2" marker-end="url(#a)"/>
  <text x="816" y="262" fill="#94a3b8" font-size="11">legge</text>

  <rect x="460" y="286" width="434" height="76" rx="10" fill="#0b1020" stroke="#22c55e"/>
  <text x="677" y="311" fill="#22c55e" font-size="13" text-anchor="middle" font-weight="700">/root/Developer/Recognizer-Mano/app/dist</text>
  <text x="677" y="332" fill="#e2e8f0" font-size="12" text-anchor="middle">la build sta DENTRO la cartella del progetto</text>
  <text x="677" y="350" fill="#94a3b8" font-size="11" text-anchor="middle">niente copie in /opt o /srv: la cartella resta portabile (regola R3)</text>

  <text x="28" y="420" fill="#64748b" font-size="11.5">Perché il proxy e non «root *» in Caddy: Caddy gira come utente «caddy» e non può entrare in /root. Copiare il sito altrove</text>
  <text x="28" y="438" fill="#64748b" font-size="11.5">avrebbe spezzato il progetto in due pezzi; un piccolo server che gira come root e legge app/dist risolve senza uscire dalla cartella.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f472b6"/>
    </marker>
  </defs>
</svg>
