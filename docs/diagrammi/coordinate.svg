<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="940" height="470" rx="14" fill="#0b1020"/>
  <text x="28" y="40" fill="#e2e8f0" font-size="20" font-weight="700">Da MediaPipe alla scena 3D: la funzione toWorld</text>
  <text x="28" y="64" fill="#94a3b8" font-size="13">Tre operazioni in due righe di codice: centrare, rovesciare la y, specchiare la x.</text>

  <!-- SINISTRA: spazio immagine -->
  <text x="60" y="108" fill="#38bdf8" font-size="14" font-weight="700">Coordinate MediaPipe (immagine)</text>
  <rect x="60" y="122" width="300" height="225" fill="#111a33" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="52" y="116" fill="#e2e8f0" font-size="11" text-anchor="end">0,0</text>
  <text x="370" y="116" fill="#94a3b8" font-size="11">x = 1</text>
  <text x="52" y="356" fill="#94a3b8" font-size="11" text-anchor="end">y = 1</text>
  <path d="M60 122 L360 122" stroke="#38bdf8" stroke-width="2" marker-end="url(#c)"/>
  <path d="M60 122 L60 347" stroke="#38bdf8" stroke-width="2" marker-end="url(#c)"/>
  <text x="200" y="140" fill="#38bdf8" font-size="12" text-anchor="middle">x cresce verso destra</text>
  <text x="76" y="240" fill="#38bdf8" font-size="12">y cresce</text>
  <text x="76" y="256" fill="#38bdf8" font-size="12">verso il basso</text>
  <circle cx="140" cy="200" r="9" fill="#f472b6"/>
  <text x="156" y="196" fill="#e2e8f0" font-size="12">polso</text>
  <text x="156" y="212" fill="#94a3b8" font-size="11">x = 0,27  y = 0,35</text>
  <text x="60" y="380" fill="#64748b" font-size="11.5">Il fotogramma NON e&#39; specchiato: la tua mano</text>
  <text x="60" y="396" fill="#64748b" font-size="11.5">destra compare a sinistra dell&#39;immagine.</text>
  <text x="60" y="412" fill="#64748b" font-size="11.5">z: relativa al polso, stessa scala della x,</text>
  <text x="60" y="428" fill="#64748b" font-size="11.5">negativa verso la camera.</text>

  <!-- FRECCIA + FORMULA -->
  <path d="M392 230 L470 230" stroke="#facc15" stroke-width="2.5" marker-end="url(#d)"/>
  <rect x="380" y="140" width="180" height="76" rx="10" fill="#1e1b4b" stroke="#facc15"/>
  <text x="470" y="164" fill="#facc15" font-size="12" text-anchor="middle" font-weight="700">toWorld(p)</text>
  <text x="470" y="184" fill="#e2e8f0" font-size="11.5" text-anchor="middle">x = (0,5 − p.x) · larghezza</text>
  <text x="470" y="200" fill="#e2e8f0" font-size="11.5" text-anchor="middle">y = (0,5 − p.y) · altezza</text>
  <text x="470" y="214" fill="#e2e8f0" font-size="11.5" text-anchor="middle">z = −p.z · larghezza · 1,6</text>
  <text x="470" y="262" fill="#94a3b8" font-size="11" text-anchor="middle">«0,5 −» fa due cose insieme:</text>
  <text x="470" y="278" fill="#94a3b8" font-size="11" text-anchor="middle">sposta l&#39;origine al centro</text>
  <text x="470" y="294" fill="#94a3b8" font-size="11" text-anchor="middle">e ribalta l&#39;asse</text>

  <!-- DESTRA: mondo 3D -->
  <text x="590" y="108" fill="#22c55e" font-size="14" font-weight="700">Coordinate della scena (Three.js)</text>
  <rect x="590" y="122" width="300" height="225" fill="#111a33" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="590" y1="234" x2="890" y2="234" stroke="#22c55e" stroke-width="2"/>
  <line x1="740" y1="122" x2="740" y2="347" stroke="#22c55e" stroke-width="2"/>
  <path d="M740 234 L884 234" stroke="#22c55e" stroke-width="2" marker-end="url(#e)"/>
  <path d="M740 234 L740 128" stroke="#22c55e" stroke-width="2" marker-end="url(#e)"/>
  <text x="866" y="226" fill="#22c55e" font-size="12">+x</text>
  <text x="750" y="140" fill="#22c55e" font-size="12">+y</text>
  <text x="746" y="250" fill="#94a3b8" font-size="11">0,0 = centro</text>
  <circle cx="830" cy="190" r="9" fill="#f472b6"/>
  <text x="700" y="186" fill="#e2e8f0" font-size="12" text-anchor="end">polso: passato a destra</text>
  <text x="700" y="202" fill="#94a3b8" font-size="11" text-anchor="end">effetto specchio</text>
  <path d="M706 190 L816 190" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#g)"/>
  <text x="590" y="380" fill="#64748b" font-size="11.5">Specchiare e&#39; voluto: muovendo la mano a destra,</text>
  <text x="590" y="396" fill="#64748b" font-size="11.5">quella sullo schermo va a destra.</text>
  <text x="590" y="412" fill="#64748b" font-size="11.5">Conseguenza: anche l&#39;etichetta destra/sinistra di</text>
  <text x="590" y="428" fill="#64748b" font-size="11.5">MediaPipe va invertita — vedi realSide in main.ts.</text>

  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#facc15"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f472b6"/></marker>
  </defs>
</svg>
