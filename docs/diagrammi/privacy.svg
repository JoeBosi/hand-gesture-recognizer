<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="940" height="470" rx="14" fill="#0b1020"/>
  <text x="28" y="40" fill="#e2e8f0" font-size="20" font-weight="700">Il confine della riservatezza</text>
  <text x="28" y="64" fill="#94a3b8" font-size="13">«Le immagini non escono dal browser» non è una promessa: è una regola imposta dal server e verificata dai test.</text>

  <!-- dentro -->
  <rect x="40" y="96" width="520" height="290" rx="14" fill="#111a33" stroke="#22c55e" stroke-width="2"/>
  <text x="64" y="126" fill="#22c55e" font-size="15" font-weight="700">Dentro il browser — tutto qui</text>

  <rect x="64" y="144" width="216" height="52" rx="9" fill="#0b1020" stroke="#334155"/>
  <text x="172" y="166" fill="#e2e8f0" font-size="12.5" text-anchor="middle">fotogrammi della webcam</text>
  <text x="172" y="184" fill="#64748b" font-size="11" text-anchor="middle">solo dentro l&#39;elemento &lt;video&gt;</text>

  <rect x="296" y="144" width="240" height="52" rx="9" fill="#0b1020" stroke="#334155"/>
  <text x="416" y="166" fill="#e2e8f0" font-size="12.5" text-anchor="middle">riconoscimento MediaPipe</text>
  <text x="416" y="184" fill="#64748b" font-size="11" text-anchor="middle">WebAssembly, in locale</text>

  <rect x="64" y="210" width="216" height="52" rx="9" fill="#0b1020" stroke="#334155"/>
  <text x="172" y="232" fill="#e2e8f0" font-size="12.5" text-anchor="middle">21 punti per mano</text>
  <text x="172" y="250" fill="#64748b" font-size="11" text-anchor="middle">numeri in memoria, mai salvati</text>

  <rect x="296" y="210" width="240" height="52" rx="9" fill="#0b1020" stroke="#334155"/>
  <text x="416" y="232" fill="#e2e8f0" font-size="12.5" text-anchor="middle">disegno 3D</text>
  <text x="416" y="250" fill="#64748b" font-size="11" text-anchor="middle">WebGL sulla tela della pagina</text>

  <rect x="64" y="278" width="472" height="92" rx="9" fill="#0f172a" stroke="#22c55e"/>
  <text x="88" y="302" fill="#22c55e" font-size="12.5" font-weight="700">Cosa NON c&#39;è, di proposito:</text>
  <text x="88" y="324" fill="#cbd5e1" font-size="12">nessun fetch di immagini, nessun MediaRecorder, nessun canvas salvato,</text>
  <text x="88" y="342" fill="#cbd5e1" font-size="12">nessun cookie, nessuna statistica, nessun log degli accessi sul server.</text>
  <text x="88" y="362" fill="#94a3b8" font-size="11.5">La camera si spegne cambiando scheda e lasciando la pagina.</text>

  <!-- muro -->
  <rect x="580" y="96" width="24" height="290" rx="6" fill="#f87171" fill-opacity="0.18" stroke="#f87171" stroke-dasharray="6 5"/>
  <text x="592" y="250" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 592 250)">Content-Security-Policy</text>

  <!-- fuori -->
  <rect x="624" y="96" width="290" height="290" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="648" y="126" fill="#94a3b8" font-size="15" font-weight="700">Fuori — cosa è permesso</text>

  <rect x="648" y="144" width="240" height="70" rx="9" fill="#111a33" stroke="#22c55e"/>
  <text x="768" y="168" fill="#22c55e" font-size="12.5" text-anchor="middle" font-weight="700">consentito</text>
  <text x="768" y="188" fill="#cbd5e1" font-size="11.5" text-anchor="middle">scaricare dal proprio dominio:</text>
  <text x="768" y="204" fill="#cbd5e1" font-size="11.5" text-anchor="middle">pagina, script, wasm, modello</text>

  <rect x="648" y="228" width="240" height="142" rx="9" fill="#111a33" stroke="#f87171"/>
  <text x="768" y="252" fill="#f87171" font-size="12.5" text-anchor="middle" font-weight="700">bloccato dal browser</text>
  <text x="768" y="274" fill="#cbd5e1" font-size="11.5" text-anchor="middle">qualunque invio verso altri domini</text>
  <text x="768" y="292" fill="#cbd5e1" font-size="11.5" text-anchor="middle">connect-src &#39;self&#39;</text>
  <text x="768" y="316" fill="#94a3b8" font-size="11" text-anchor="middle">È così che si è scoperta la telemetria</text>
  <text x="768" y="332" fill="#94a3b8" font-size="11" text-anchor="middle">di MediaPipe verso Google: la CSP</text>
  <text x="768" y="348" fill="#94a3b8" font-size="11" text-anchor="middle">l&#39;ha fermata, poi l&#39;abbiamo tolta</text>
  <text x="768" y="364" fill="#94a3b8" font-size="11" text-anchor="middle">direttamente dal codice.</text>

  <text x="28" y="420" fill="#64748b" font-size="11.5">Anche le intestazioni collaborano: Permissions-Policy «camera=(self), microphone=(), geolocation=()» impedisce che una</text>
  <text x="28" y="438" fill="#64748b" font-size="11.5">pagina incorporata chieda la camera, e frame-ancestors &#39;none&#39; impedisce che il sito venga incorniciato da altri.</text>
  <text x="28" y="456" fill="#64748b" font-size="11.5">Il test automatico controlla a ogni esecuzione che le richieste verso altri domini siano esattamente zero.</text>
</svg>
