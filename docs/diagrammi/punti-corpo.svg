  <text x="494" y="126" fill="#e2e8f0" font-size="14" font-weight="700">Come sono numerati</text>
  <text x="494" y="152" fill="#cbd5e1" font-size="12.5">0-10   viso: naso, occhi, orecchie, bocca</text>
  <text x="494" y="174" fill="#cbd5e1" font-size="12.5">11-16 spalle, gomiti, polsi</text>
  <text x="494" y="196" fill="#cbd5e1" font-size="12.5">17-22 mani (mignolo, indice, pollice)</text>
  <text x="494" y="218" fill="#cbd5e1" font-size="12.5">23-28 anche, ginocchia, caviglie</text>
  <text x="494" y="240" fill="#cbd5e1" font-size="12.5">29-32 talloni e punte dei piedi</text>
