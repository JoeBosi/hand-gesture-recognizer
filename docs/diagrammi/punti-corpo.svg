  <text x="494" y="310" fill="#c7d2fe" font-size="14" font-weight="700">Una regola comoda</text>
  <text x="494" y="334" fill="#cbd5e1" font-size="12.5">Dal punto 11 in poi: indice DISPARI = lato sinistro,</text>
  <text x="494" y="354" fill="#cbd5e1" font-size="12.5">indice PARI = lato destro. Il codice la usa per dare</text>
  <text x="494" y="374" fill="#cbd5e1" font-size="12.5">un colore a ogni arto (isLeft in body3d.ts).</text>
  <rect x="470" y="406" width="424" height="130" rx="12" fill="#111a33" stroke="#facc15"/>
  <text x="494" y="434" fill="#facc15" font-size="14" font-weight="700">visibility: il numero che salva la figura</text>
  <text x="494" y="458" fill="#cbd5e1" font-size="12.5">Ogni punto dice quanto il modello e&#39; sicuro di vederlo.</text>
  <text x="494" y="478" fill="#cbd5e1" font-size="12.5">Se sei seduto, le gambe sotto il tavolo vengono</text>
  <text x="494" y="498" fill="#cbd5e1" font-size="12.5">INDOVINATE: sotto 0,5 semplicemente non si disegnano,</text>
  <text x="494" y="518" fill="#cbd5e1" font-size="12.5">e lo scheletro resta onesto invece che buffo.</text>
  <text x="28" y="566" fill="#64748b" font-size="11.5">&quot;Sinistra&quot; e &quot;destra&quot; sono quelle della persona ripresa. Siccome la scena specchia la x, il lato sinistro compare a sinistra dello</text>
  <text x="28" y="584" fill="#64748b" font-size="11.5">schermo: come in uno specchio, e senza bisogno dell&#39;inversione che serviva invece per la mano.</text>
