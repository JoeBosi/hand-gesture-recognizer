  <rect x="470" y="96" width="384" height="190" rx="12" fill="#111a33" stroke="#334155"/>
  <text x="494" y="126" fill="#e2e8f0" font-size="14" font-weight="700">Legenda</text>
  <circle cx="504" cy="152" r="8" fill="#f472b6"/>
  <text x="524" y="157" fill="#cbd5e1" font-size="12.5">0 — polso: origine della profondità z</text>
  <circle cx="504" cy="184" r="8" fill="#38bdf8"/>
  <text x="524" y="189" fill="#cbd5e1" font-size="12.5">1-4 pollice · 5-8 indice · 9-12 medio</text>
  <circle cx="504" cy="216" r="8" fill="#38bdf8"/>
  <text x="524" y="221" fill="#cbd5e1" font-size="12.5">13-16 anulare · 17-20 mignolo</text>
  <circle cx="504" cy="248" r="8" fill="#ffffff"/>
  <text x="524" y="253" fill="#cbd5e1" font-size="12.5">4, 8, 12, 16, 20 — punte (in 3D brillano)</text>
  <rect x="470" y="302" width="384" height="140" rx="12" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="494" y="330" fill="#c7d2fe" font-size="14" font-weight="700">Il palmo in 3D</text>
  <text x="494" y="354" fill="#cbd5e1" font-size="12.5">L&#39;area azzurra usa sei punti: 0, 1, 5, 9, 13, 17.</text>
  <text x="494" y="374" fill="#cbd5e1" font-size="12.5">Sono i vertici del ventaglio di triangoli disegnato</text>
  <text x="494" y="394" fill="#cbd5e1" font-size="12.5">in hand3d.ts (costante PALM).</text>
  <text x="494" y="422" fill="#94a3b8" font-size="12">Le 21 linee grigie sono HAND_CONNECTIONS:</text>
  <text x="494" y="438" fill="#94a3b8" font-size="12">un cilindro per ognuna.</text>
  <text x="28" y="516" fill="#64748b" font-size="11.5">Ogni punto arriva con tre numeri: x e y fra 0 e 1 sull&#39;immagine, z relativa al polso (negativa = piu&#39; vicino alla camera).</text>
  <text x="28" y="534" fill="#64748b" font-size="11.5">La forma della mano e&#39; tutta qui: l&#39;app non fa altro che ricollocare 21 sfere e 21 cilindri su questi numeri.</text>
