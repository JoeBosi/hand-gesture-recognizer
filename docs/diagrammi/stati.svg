<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="920" height="400" rx="14" fill="#0b1020"/>
  <text x="28" y="40" fill="#e2e8f0" font-size="20" font-weight="700">I quattro stati della pagina (setState in main.ts)</text>
  <text x="28" y="64" fill="#94a3b8" font-size="13">Un solo punto del codice decide cosa si vede: da lì dipendono riquadro iniziale, barra, anteprima e pulsanti.</text>

  <!-- idle -->
  <rect x="40" y="120" width="170" height="86" rx="43" fill="#111a33" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="156" fill="#e2e8f0" font-size="16" font-weight="700" text-anchor="middle">idle</text>
  <text x="125" y="178" fill="#94a3b8" font-size="11.5" text-anchor="middle">camera spenta</text>
  <text x="125" y="194" fill="#64748b" font-size="11" text-anchor="middle">si vede il riquadro iniziale</text>

  <path d="M218 146 L288 146" stroke="#38bdf8" stroke-width="2" marker-end="url(#s)"/>
  <text x="253" y="136" fill="#38bdf8" font-size="11" text-anchor="middle">clic su</text>
  <text x="253" y="124" fill="#38bdf8" font-size="11" text-anchor="middle">«Accendi»</text>

  <!-- loading -->
  <rect x="296" y="120" width="180" height="86" rx="43" fill="#111a33" stroke="#facc15" stroke-width="1.5"/>
  <text x="386" y="156" fill="#facc15" font-size="16" font-weight="700" text-anchor="middle">loading</text>
  <text x="386" y="178" fill="#94a3b8" font-size="11.5" text-anchor="middle">modello, poi camera</text>
  <text x="386" y="194" fill="#64748b" font-size="11" text-anchor="middle">pulsante disattivato</text>

  <path d="M484 146 L560 146" stroke="#22c55e" stroke-width="2" marker-end="url(#t)"/>
  <text x="522" y="130" fill="#22c55e" font-size="11" text-anchor="middle">tutto pronto</text>

  <!-- running -->
  <rect x="568" y="120" width="180" height="86" rx="43" fill="#111a33" stroke="#22c55e" stroke-width="1.5"/>
  <text x="658" y="156" fill="#22c55e" font-size="16" font-weight="700" text-anchor="middle">running</text>
  <text x="658" y="178" fill="#94a3b8" font-size="11.5" text-anchor="middle">● Camera accesa</text>
  <text x="658" y="194" fill="#64748b" font-size="11" text-anchor="middle">il ciclo loop() gira</text>

  <!-- error -->
  <rect x="296" y="278" width="180" height="82" rx="41" fill="#111a33" stroke="#f87171" stroke-width="1.5"/>
  <text x="386" y="312" fill="#f87171" font-size="16" font-weight="700" text-anchor="middle">error</text>
  <text x="386" y="334" fill="#94a3b8" font-size="11.5" text-anchor="middle">messaggio in chiaro</text>
  <text x="386" y="350" fill="#64748b" font-size="11" text-anchor="middle">permesso negato, camera occupata…</text>

  <path d="M386 214 L386 270" stroke="#f87171" stroke-width="2" marker-end="url(#u)"/>
  <text x="398" y="246" fill="#f87171" font-size="11">errore in avvio</text>

  <path d="M296 318 L125 318 L125 214" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#v)"/>
  <text x="200" y="336" fill="#94a3b8" font-size="11" text-anchor="middle">nuovo tentativo</text>

  <path d="M658 214 L658 318 L484 318" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#v)" stroke-dasharray="0"/>
  <text x="672" y="262" fill="#94a3b8" font-size="11">«Spegni camera»</text>
  <text x="672" y="278" fill="#94a3b8" font-size="11">scheda in secondo piano</text>
  <text x="672" y="294" fill="#94a3b8" font-size="11">uscita dalla pagina</text>
  <text x="560" y="336" fill="#64748b" font-size="11" text-anchor="middle">→ torna a idle</text>

  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/></marker>
    <marker id="u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
